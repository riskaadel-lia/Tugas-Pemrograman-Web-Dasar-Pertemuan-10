<html>
    <head>
        <title>Style With CSS</title>
        <style>
            p {
                color: red;
                background-color: yellow;
                border: 1px solid #a9a9a9;
                padding: 15px;
            }

            a{
                color: white;
                text-decoration: none;
            }

            a:hover{
                color: yellow;   
            }

            a:visited{
                color: white;
            }
        </style>
    </head>
    <body>
        <p>Paragrap Ini Akan Di Tampilkan Dengan Pengaturan Gaya Menggunakan CSS. 
           Paragrap Merupakan Salah Satu Dari Elemen Berjenis Block Yang Akan Tampil
           Di Browser Memenuhi Area Dari Ujung Kiri Sampai Kanan Layar.
           Elemen Block Lainnya Adalah Heading</p><br>

        <a href="https://google.com">Mengarah Ke Google</a>
    </body>
</html>
